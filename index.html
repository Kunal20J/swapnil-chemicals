<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Swapnil Chemicals | Cart + Google Pay</title>
    <link rel="icon" type="image/jpeg" href="SC Logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: "#0f172a" }, fontFamily: { sans: ["Inter"] } } }
        };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .dark body { background: #0f172a; color: #e2e8f0; }
        .glass-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.3); }
        .dark .glass-card { background: rgba(30,41,59,0.9); }
        .product-card { transition: all 0.3s; border-radius: 1.5rem; background: white; }
        .dark .product-card { background: #1e293b; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 20px 30px -12px rgba(0,0,0,0.2); }
        .cart-drawer { position: fixed; top: 0; right: -480px; width: 100%; max-width: 480px; height: 100vh; background: white; z-index: 1000; transition: right 0.3s; box-shadow: -5px 0 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; }
        .dark .cart-drawer { background: #0f172a; }
        .cart-drawer.open { right: 0; }
        .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; opacity: 0; visibility: hidden; transition: 0.2s; }
        .cart-overlay.active { opacity: 1; visibility: visible; }
        .gradient-text { background: linear-gradient(135deg, #3b82f6, #1d4ed8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .gpay-btn { background: linear-gradient(135deg, #34a853, #1a8a3c); }
        .gpay-btn:hover { background: linear-gradient(135deg, #2d9142, #0f6e2d); transform: translateY(-2px); }
        .product-image-container { height: 200px; display: flex; align-items: center; justify-content: center; background: #f9fafb; }
        .product-image { max-height: 100%; max-width: 100%; object-fit: contain; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-50 backdrop-blur-xl bg-white/80 dark:bg-slate-900/80 border-b">
        <div class="container mx-auto px-5 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full overflow-hidden ring-2 ring-blue-500/30">
                    <img src="SC Logo.jpg" alt="logo" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-xl font-bold gradient-text">Swapnil Chemicals</h1>
                    <p class="text-xs text-gray-500">Auto care products</p>
                </div>
            </div>
            <div class="flex gap-4 items-center">
                <button id="themeToggle" class="w-9 h-9 rounded-full bg-gray-100 dark:bg-slate-700">🌙</button>
                <button id="cartIcon" class="relative p-2 rounded-full bg-gray-100 dark:bg-slate-800">
                    <i class="fas fa-shopping-cart text-xl"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="bg-gradient-to-br from-slate-800 via-blue-900 to-slate-800 text-white py-20 text-center">
        <h2 class="text-4xl md:text-5xl font-bold">Premium <span class="text-blue-300">Automobile</span> Cleaning</h2>
        <p class="mt-4 max-w-xl mx-auto">Add products to cart, then pay securely with Google Pay or any UPI app.</p>
        <a href="#products" class="inline-block mt-6 bg-white text-blue-800 px-6 py-2 rounded-full font-semibold">Shop Now</a>
    </section>

    <!-- Products Grid -->
    <section id="products" class="py-16 px-5">
        <div class="container mx-auto">
            <h3 class="text-3xl font-bold text-center gradient-text mb-10">Our Products</h3>
            <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-7"></div>
        </div>
    </section>

    <!-- Cart Drawer -->
    <div id="cartOverlay" class="cart-overlay"></div>
    <div id="cartDrawer" class="cart-drawer">
        <div class="flex justify-between items-center p-5 border-b">
            <h2 class="text-2xl font-bold"><i class="fas fa-shopping-cart text-blue-500"></i> Your Cart</h2>
            <button id="closeCart" class="text-3xl">&times;</button>
        </div>
        <div id="cartItems" class="flex-1 overflow-auto p-5 space-y-4"></div>
        <div class="p-5 border-t bg-white dark:bg-slate-900">
            <div class="flex justify-between text-xl font-bold mb-3">
                <span>Total</span>
                <span id="cartTotalAmount">₹0</span>
            </div>
            <button id="checkoutGPay" class="gpay-btn w-full py-3 rounded-xl text-white font-bold flex items-center justify-center gap-2">
                <img src="https://www.gstatic.com/instantbuy/svg/dark_gpay.svg" alt="GPay" class="h-5 brightness-0 invert">
                Pay with Google Pay
            </button>
            <div class="mt-4 text-center text-sm">
                <button id="copyUpiLink" class="text-blue-600 underline text-sm">Copy UPI Link</button>
                <span class="mx-2">|</span>
                <button id="showQRcode" class="text-blue-600 underline text-sm">Show QR Code</button>
            </div>
            <div id="qrContainer" class="mt-3 hidden flex justify-center"></div>
        </div>
    </div>

    <!-- Contact / Footer -->
    <footer class="bg-slate-900 text-white py-8 text-center text-sm mt-10">
        <p>© 2026 Swapnil Chemicals | Jaipur | GST: 08CIJPS1734A1ZE</p>
        <p class="text-slate-400">Call: <a href="tel:9352470085" class="text-blue-300">9352470085</a></p>
    </footer>

    <script>
        // ---------- PRODUCT DATA ----------
        const products = [
            { id: 1, name: "Dashboard Polish", image: "Dashboard Polish.jpeg", price: 200, unit: "Litre" },
            { id: 2, name: "Tyre Polish", image: "Tyre Polish.jpeg", price: 150, unit: "Litre" },
            { id: 3, name: "Car Foaming Wash", image: "Car Foaming Wash.jpeg", price: 70, unit: "Litre" },
            { id: 4, name: "Glass Cleaner", image: "Glass Cleaner.jpeg", price: 70, unit: "Litre" },
            { id: 5, name: "Interior Cleaner", image: "Interior Cleaner.png", price: 130, unit: "Litre" },
            { id: 6, name: "Foaming Gun", image: "Foaming Gun.jpeg", price: 2000, unit: "Piece" },
            { id: 7, name: "Micro Towel (Blue)", image: "Micro Towel.jpg", price: 70, unit: "Piece" },
            { id: 8, name: "Micro Towel Premium", image: "Micro Towel 2.jpg", price: 110, unit: "Piece" },
            { id: 9, name: "Micro Towel Deluxe", image: "Micro Towel 3.jpg", price: 130, unit: "Piece" }
        ];

        // ---------- CART STATE (localStorage) ----------
        let cart = [];
        function saveCart() { localStorage.setItem('autoCart', JSON.stringify(cart)); updateBadge(); renderCartDrawer(); }
        function loadCart() { const stored = localStorage.getItem('autoCart'); if(stored) cart = JSON.parse(stored); else cart = []; updateBadge(); renderCartDrawer(); }
        function updateBadge() { const count = cart.reduce((s,i)=>s+i.qty,0); document.getElementById('cartBadge').innerText = count; }

        function addToCart(product, qty) {
            const existing = cart.find(i=>i.id===product.id);
            if(existing) existing.qty += qty;
            else cart.push({ ...product, qty });
            saveCart();
            showToast(`${product.name} added (${qty})`);
            openDrawer();
        }

        function removeItem(id) { cart = cart.filter(i=>i.id!==id); saveCart(); }
        function updateQty(id, newQty) { if(newQty<1) removeItem(id); else { const item = cart.find(i=>i.id===id); if(item) item.qty = newQty; saveCart(); } }
        function getTotal() { return cart.reduce((s,i)=>s + (i.price * i.qty), 0); }

        // ---- UPI LINK with CORRECT VPA (Bank of India UPI ID: 9352470085@boi) ----
        function getUpiLinkForCart() {
            const total = getTotal();
            if(total === 0) return null;
            const itemsText = cart.map(i=>`${i.name} x${i.qty}`).join(', ').slice(0, 90);
            const note = encodeURIComponent(`Swapnil Chemicals Order: ${itemsText}`);
            // Correct VPA format: mobile@bank (assuming 9352470085 is linked to Bank of India)
            const vpa = "9352470085@boi";
            const payeeName = encodeURIComponent("Swapnil Chemicals");
            return `upi://pay?pa=${vpa}&pn=${payeeName}&am=${total}&cu=INR&tn=${note}`;
        }

        // Helper to copy link
        function copyUpiLink() {
            const link = getUpiLinkForCart();
            if(!link) { alert("Cart is empty"); return; }
            navigator.clipboard.writeText(link);
            showToast("UPI link copied! Open GPay manually.");
        }

        // Show QR Code for the exact amount
        function showQrModal() {
            const total = getTotal();
            if(total === 0) { alert("Cart empty"); return; }
            const qrContainer = document.getElementById('qrContainer');
            const upiLink = getUpiLinkForCart();
            if(upiLink) {
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiLink)}`;
                qrContainer.innerHTML = `<div class="text-center"><img src="${qrUrl}" class="mx-auto rounded-xl shadow"><p class="text-xs mt-2">Scan with any UPI app</p><p class="text-xs font-mono break-all">₹${total}</p></div>`;
                qrContainer.classList.remove('hidden');
                setTimeout(() => { qrContainer.classList.add('hidden'); }, 10000);
            }
        }

        // Render Cart Drawer
        function renderCartDrawer() {
            const container = document.getElementById('cartItems');
            const totalSpan = document.getElementById('cartTotalAmount');
            if(!container) return;
            if(cart.length===0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-10">Cart is empty</div>`;
                totalSpan.innerText = '₹0';
                return;
            }
            let html = '';
            cart.forEach(item => {
                html += `
                    <div class="flex gap-3 border-b pb-3">
                        <div class="w-16 h-16 bg-gray-100 rounded-lg overflow-hidden"><img src="${item.image}" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/100?text=No+Img'"></div>
                        <div class="flex-1">
                            <h4 class="font-bold">${item.name}</h4>
                            <p class="text-sm">₹${item.price} / ${item.unit}</p>
                            <div class="flex items-center gap-2 mt-1">
                                <button class="dec-qty w-6 h-6 rounded-full bg-gray-200 dark:bg-slate-700" data-id="${item.id}">-</button>
                                <input type="number" value="${item.qty}" min="1" class="cart-qty w-14 text-center border rounded-full" data-id="${item.id}">
                                <button class="inc-qty w-6 h-6 rounded-full bg-gray-200 dark:bg-slate-700" data-id="${item.id}">+</button>
                                <button class="remove-item text-red-500 ml-auto" data-id="${item.id}"><i class="fas fa-trash"></i></button>
                            </div>
                            <div class="text-right font-semibold">₹${item.price * item.qty}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            totalSpan.innerText = `₹${getTotal()}`;
            // attach events after render
            document.querySelectorAll('.dec-qty').forEach(btn => {
                btn.addEventListener('click', (e) => { const id = parseInt(btn.dataset.id); const item = cart.find(i=>i.id===id); if(item) updateQty(id, item.qty-1); });
            });
            document.querySelectorAll('.inc-qty').forEach(btn => {
                btn.addEventListener('click', (e) => { const id = parseInt(btn.dataset.id); const item = cart.find(i=>i.id===id); if(item) updateQty(id, item.qty+1); });
            });
            document.querySelectorAll('.cart-qty').forEach(inp => {
                inp.addEventListener('change', (e) => { const id = parseInt(inp.dataset.id); let val = parseInt(inp.value); if(isNaN(val)) val=1; updateQty(id, val); });
            });
            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', (e) => { const id = parseInt(btn.dataset.id); removeItem(id); });
            });
        }

        // Drawer controls
        function openDrawer() { document.getElementById('cartDrawer').classList.add('open'); document.getElementById('cartOverlay').classList.add('active'); document.body.style.overflow = 'hidden'; }
        function closeDrawer() { document.getElementById('cartDrawer').classList.remove('open'); document.getElementById('cartOverlay').classList.remove('active'); document.body.style.overflow = ''; }

        // Toast
        function showToast(msg) {
            let t = document.getElementById('toastMsg');
            if(!t) { t = document.createElement('div'); t.id='toastMsg'; t.className='fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-black text-white px-4 py-2 rounded-full text-sm z-[1100] opacity-0 transition'; document.body.appendChild(t); }
            t.innerText = msg; t.style.opacity = '1'; setTimeout(()=>t.style.opacity='0',2000);
        }

        // Render products with add to cart
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            if(!grid) return;
            grid.innerHTML = products.map(p => `
                <div class="product-card p-4 shadow-md rounded-2xl bg-white dark:bg-slate-800">
                    <div class="product-image-container rounded-xl">
                        <img src="${p.image}" class="product-image h-36 w-full object-contain" onerror="this.src='https://placehold.co/200x150?text=Image+NA'">
                    </div>
                    <h3 class="text-xl font-bold mt-3">${p.name}</h3>
                    <p class="text-gray-500 text-sm">${p.description || 'Premium quality'}</p>
                    <div class="flex justify-between items-center mt-3">
                        <span class="text-2xl font-bold gradient-text">₹${p.price}</span>
                        <span class="text-xs">/ ${p.unit}</span>
                    </div>
                    <div class="mt-3 flex gap-2">
                        <div class="flex border rounded-full overflow-hidden">
                            <button class="prod-minus w-8 bg-gray-100 dark:bg-slate-700" data-id="${p.id}">-</button>
                            <input type="number" id="qty_${p.id}" value="1" min="1" class="w-12 text-center border-0 outline-none">
                            <button class="prod-plus w-8 bg-gray-100 dark:bg-slate-700" data-id="${p.id}">+</button>
                        </div>
                        <button class="add-cart bg-blue-600 text-white px-4 py-1 rounded-full text-sm flex-1" data-id="${p.id}"><i class="fas fa-cart-plus"></i> Add</button>
                    </div>
                    <div class="flex gap-2 mt-3 text-xs">
                        <a href="tel:9352470085" class="bg-gray-100 dark:bg-slate-700 p-1 rounded text-center flex-1"><i class="fas fa-phone"></i> Call</a>
                        <a href="https://wa.me/919352470085?text=Hi, interested in ${p.name}" target="_blank" class="bg-green-100 dark:bg-green-900 p-1 rounded text-center flex-1"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                    </div>
                </div>
            `).join('');
            // bind events
            products.forEach(p => {
                const minus = document.querySelector(`.prod-minus[data-id="${p.id}"]`);
                const plus = document.querySelector(`.prod-plus[data-id="${p.id}"]`);
                const qtyInput = document.getElementById(`qty_${p.id}`);
                const addBtn = document.querySelector(`.add-cart[data-id="${p.id}"]`);
                if(minus) minus.onclick = () => { let v = parseInt(qtyInput.value); if(v>1) qtyInput.value = v-1; };
                if(plus) plus.onclick = () => { let v = parseInt(qtyInput.value); qtyInput.value = v+1; };
                if(addBtn) addBtn.onclick = () => { let qty = parseInt(qtyInput.value) || 1; addToCart(p, qty); };
            });
        }

        // Payment handler (opens GPay)
        function handleGpayCheckout() {
            const total = getTotal();
            if(total === 0) { alert("Cart is empty. Add products first."); return; }
            const upiLink = getUpiLinkForCart();
            if(upiLink) {
                window.location.href = upiLink;
                showToast(`Redirecting to GPay for ₹${total}`);
            } else {
                alert("Unable to generate payment link.");
            }
        }

        // Dark mode
        function initDarkMode() {
            const toggle = document.getElementById('themeToggle');
            if(localStorage.getItem('theme')==='dark') document.documentElement.classList.add('dark');
            toggle.onclick = () => {
                document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
                toggle.innerText = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
            };
            toggle.innerText = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            loadCart();
            initDarkMode();
            document.getElementById('cartIcon').onclick = openDrawer;
            document.getElementById('closeCart').onclick = closeDrawer;
            document.getElementById('cartOverlay').onclick = closeDrawer;
            document.getElementById('checkoutGPay').onclick = handleGpayCheckout;
            document.getElementById('copyUpiLink').onclick = copyUpiLink;
            document.getElementById('showQRcode').onclick = showQrModal;
        });
    </script>
</body>
</html>
